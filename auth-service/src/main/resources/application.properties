# ═══════════════════════════════════
#  Auth Service Configuration
# ═══════════════════════════════════

# ── Server (different port from mvc-crud) ──
server.port=8083

# ── Oracle JDBC Driver ──
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ── Oracle ADB Datasource (AUTH_USER schema) ──
spring.datasource.url=jdbc:oracle:thin:@damg6210db_high
spring.datasource.username=AUTH_USER
spring.datasource.password=Auth_Password123

# ── JWT Configuration ──
jwt.secret=myAuthServiceSuperSecretKeyForJWT2025ThatIsAtLeast256BitsLong!!
jwt.expiration-ms=86400000

# ── Error details ──
server.error.include-message=always

# ── Logging ──
logging.level.authservice=DEBUG
logging.level.org.springframework.web=DEBUG

# ── Disable Spring Security's default login page & filters ──
# We only want BCrypt, not the full security filter chain
spring.security.filter.order=100
